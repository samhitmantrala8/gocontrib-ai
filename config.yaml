# GoContrib-AI runtime configuration. CLI flags override these.

llm:
  provider: gemini
  model: gemini-2.5-flash         # primary model (free tier on AI Studio)
  fallback_provider: openrouter
  fallback_model: deepseek/deepseek-chat

  # Tried in order, ACROSS the whole key pool, before giving up. The runtime
  # rotates ``GEMINI_API_KEYS`` (comma-separated) for each model in turn, then
  # moves to OpenRouter. Adding more models here makes a long ReAct loop
  # survive longer when the free tier rate-limits us.
  # Order is "try this combo first". 2.5-flash-lite has the most generous
  # free quota and the lowest latency in our tests; we lead with it.
  gemini_models:
    - gemini-2.5-flash-lite
    - gemini-2.5-flash
    - gemini-flash-latest
    - gemini-2.0-flash

  openrouter_models:
    - meta-llama/llama-3.3-70b-instruct
    - openai/gpt-4o-mini
    - deepseek/deepseek-chat

  temperature: 0.1
  max_output_tokens: 8192
  request_timeout_seconds: 90

retrieval:
  top_k: 12
  bm25_weight: 0.4                  # lexical: great for Go identifier names
  dense_weight: 0.5                 # semantic: catches paraphrased intent
  graph_weight: 0.1                 # one-hop AST symbol-graph expansion
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  chunk_strategy: ast_symbol
  max_chunk_chars: 4000

patcher:
  max_react_steps: 18
  max_revise_loops: 3
  reproducer_enabled: true

guardrails:
  max_diff_lines: 400
  max_files_touched: 8
  banned_paths:
    - "vendor/"
    - "*.pem"
    - "*.key"
    - "Dockerfile"
    - ".github/workflows/"
    - "go.sum"
  banned_patterns:
    - "panic("
    - "os.Exit("
  must_compile: true
  must_pass_vet: true
  forbid_new_dependencies: true

validator:
  run_focused_tests: true
  test_timeout_seconds: 120
  go_binary: go

github:
  default_branch_prefix: gocontrib-ai/
  scrape_recent_prs: 15
